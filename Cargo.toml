[package]
name = "openvm-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# openvm
openvm = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false, features = [
    "std",
] }
openvm-algebra-complex-macros = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false }
k256 = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false }
p256 = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false }
openvm-pairing = { git = "https://github.com/openvm-org/openvm.git", branch = "feat/new-execution", default-features = false, features = [
    "bn254",
    "bls12_381",
] }

# revm
revm-precompile = { git = "https://github.com/axiom-crypto/revm", branch = "v75-openvm-new-exec", default-features = false, features = [
    "std",
    # p256 precompile
    "secp256r1",
    # openvm intrinsics
    "openvm-bn",
    "openvm-sha2",
    "openvm-k256",
    "openvm-kzg",
    "openvm-kzg-intrinsics",
] }
revm-primitives = { git = "https://github.com/axiom-crypto/revm", branch = "v75-openvm-new-exec", default-features = false, features = [
    "std",
] }

getrandom = { version = "0.2.16", default-features = false, features = [
    "custom",
] }

# testing
hex-literal = "0.4.1"

